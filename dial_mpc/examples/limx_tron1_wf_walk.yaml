# DIAL-MPC
seed: 0
output_dir: limx_tron1_wf_walk
n_steps: 400

env_name: limx_tron1_wf_walk
Nsample: 2048
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0

# Tron1 wheeled-foot
# per actuator: abad_L, hip_L, knee_L, wheel_L, abad_R, hip_R, knee_R, wheel_R
# wheels: kp = 0 (no position target), kd = wheel velocity gain
kp: [120.0, 120.0, 120.0, 0.0, 120.0, 120.0, 120.0, 0.0]
kd: [5.0, 5.0, 5.0, 0.8, 5.0, 5.0, 5.0, 0.8]
max_wheel_vel: 20.0
default_vx: 1.0
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
default_height: 0.72
