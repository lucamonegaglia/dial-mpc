# DIAL-MPC sim-to-sim domain-shift evaluation
#
# Same planner settings as unitree_h1_loco.yaml. The `domain_randomization` block below
# is consumed only by `dial-mpc-sim2sim-eval` / `dial_mpc.sim2sim`; `load_dataclass_from_dict`
# ignores unknown keys, so this file also loads cleanly under plain `dial-mpc`.
seed: 0
output_dir: sim2sim_results/unitree_h1_loco
n_steps: 400

env_name: unitree_h1_loco
Nsample: 2048
Hsample: 20
Hnode: 5
Ndiffuse: 1
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.2
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0

# H1
default_vx: 0.6
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 3.0
gait: walk

# Sim-to-sim domain randomization.
# mode: scale -> nominal * U(range); add -> nominal + U(range); abs -> U(range) directly.
# dist: uniform (default) or log_uniform (range must be strictly positive).
# select: "all" | "actuated" (dof_* fields only, excludes the 6 free-base dofs) | list of
#   body/geom/actuator/joint names | list of explicit integer indices.
# per_element: false (default) draws one shared scalar for every selected entry;
#   true draws one iid value per entry.
domain_randomization:
  n_trials: 256
  seed: 12345
  paired: true          # also run a nominal-plant control trial at the same seed
  save_rollouts: false  # dump EVERY trial's state log; the most divergent trials are
                        # always saved under interesting/ regardless of this flag
  n_interesting: 12     # how many divergent trial pairs to save state logs for
  terminate_on_physical_limits: false
  params:
    # +/-20% of torso_link mass (nominal 24.457 kg)
    torso_mass:
      target: sys
      field: body_mass
      select: [torso_link]
      mode: scale
      range: [0.80, 1.20]
    # +/-10% on each LIMB mass, independently. Deliberately excludes torso_link (its
    # mass is the `torso_mass` axis above -- `select: all` would scale it a second time,
    # making the two axes multiply and their individual effects unattributable) and
    # `world`, whose mass is 0 so scaling it is a no-op that shows up as a dead column.
    limb_mass:
      target: sys
      field: body_mass
      select: [pelvis,
               left_hip_yaw_link, left_hip_roll_link, left_hip_pitch_link,
               left_knee_link, left_ankle_link,
               right_hip_yaw_link, right_hip_roll_link, right_hip_pitch_link,
               right_knee_link, right_ankle_link]
      mode: scale
      range: [0.90, 1.10]
      per_element: true
    # +/-40% ground friction (nominal 1.0)
    friction:
      target: sys
      field: geom_friction
      select: all
      column: 0
      mode: scale
      range: [0.60, 1.40]
    # 0.5x-2x joint damping on the 11 actuated dofs (nominal 2.0), log-uniform so under-
    # and over-damped are equally likely on a log scale
    damping:
      target: sys
      field: dof_damping
      select: actuated
      mode: scale
      range: [0.5, 2.0]
      dist: log_uniform
    # 0.5x-2x joint armature (nominal 0.1)
    armature:
      target: sys
      field: dof_armature
      select: actuated
      mode: scale
      range: [0.5, 2.0]
      dist: log_uniform
    # +/-2cm pelvis/torso center-of-mass offset per axis
    com_offset:
      target: sys
      field: body_ipos
      select: [pelvis, torso_link]
      mode: add
      range: [-0.02, 0.02]
      per_element: true
    # controller-gain mismatch: +/-30% of the (11-element) kp/kd gain vectors, shared
    # across joints (per_element: true would draw one factor per joint instead)
    kp:
      target: config
      field: kp
      mode: scale
      range: [0.70, 1.30]
    kd:
      target: config
      field: kd
      mode: scale
      range: [0.70, 1.30]
