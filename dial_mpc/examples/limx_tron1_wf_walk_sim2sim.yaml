# DIAL-MPC sim-to-sim domain-shift evaluation, LIMX Tron1 wheeled-foot biped
#
# Same planner settings as limx_tron1_wf_walk.yaml. The `domain_randomization` block below
# is consumed only by `dial-mpc-sim2sim-eval` / `dial_mpc.sim2sim`; `load_dataclass_from_dict`
# ignores unknown keys, so this file also loads cleanly under plain `dial-mpc`.
seed: 0
output_dir: sim2sim_results/limx_tron1_wf_walk
n_steps: 400

env_name: limx_tron1_wf_walk
Nsample: 2048
Hsample: 20
Hnode: 5
Ndiffuse: 1
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0

# Tron1 wheeled-foot
# per actuator: abad_L, hip_L, knee_L, wheel_L, abad_R, hip_R, knee_R, wheel_R
# wheels: kp = 0 (no position target), kd = wheel velocity gain
kp: [120.0, 120.0, 120.0, 0.0, 120.0, 120.0, 120.0, 0.0]
kd: [5.0, 5.0, 5.0, 0.8, 5.0, 5.0, 5.0, 0.8]
max_wheel_vel: 20.0
default_vx: 1.0
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
default_height: 0.72

# Sim-to-sim domain randomization.
# mode: scale -> nominal * U(range); add -> nominal + U(range); abs -> U(range) directly.
# dist: uniform (default) or log_uniform (range must be strictly positive).
# select: "all" | "actuated" (dof_* fields only, excludes the 6 free-base dofs) | list of
#   body/geom/actuator/joint names | list of explicit integer indices.
# per_element: false (default) draws one shared scalar for every selected entry;
#   true draws one iid value per entry.
domain_randomization:
  n_trials: 256
  seed: 12345
  paired: true          # also run a nominal-plant control trial at the same seed
  save_rollouts: false  # dump EVERY trial's state log; the most divergent trials are
                        # always saved under interesting/ regardless of this flag
  n_interesting: 12     # how many divergent trial pairs to save state logs for
  # false: `done` is judged against the leg action band (home +/- 0.3/0.5/0.44 rad on
  # abad/hip/knee), overriding the env's own default of physical leg limits.
  terminate_on_physical_limits: false
  params:
    # +/-20% of base_Link mass (nominal 9.595 kg)
    base_mass:
      target: sys
      field: body_mass
      select: [base_Link]
      mode: scale
      range: [0.80, 1.20]
    # +/-10% on each limb mass, independently. Excludes base_Link (the `base_mass` axis;
    # `select: all` would scale it twice) and `world` (mass 0, a dead column).
    limb_mass:
      target: sys
      field: body_mass
      select: [abad_L_Link, hip_L_Link, knee_L_Link, wheel_L_Link,
               abad_R_Link, hip_R_Link, knee_R_Link, wheel_R_Link]
      mode: scale
      range: [0.90, 1.10]
      per_element: true
    # +/-40% ground friction. Contact friction is the max over the pair, so the floor's
    # 1.0 (not the wheels' 0.6) is what is actually in effect.
    friction:
      target: sys
      field: geom_friction
      select: all
      column: 0
      mode: scale
      range: [0.60, 1.40]
    # Joint damping, absolute: the nominal is 0.01, so a scale range would be a dead axis.
    # Negligible against the leg kd (5.0), but up to ~40% of the wheel velocity gain (0.8),
    # i.e. unmodelled rolling drag.
    damping:
      target: sys
      field: dof_damping
      select: actuated
      mode: abs
      range: [0.0, 0.3]
    # 0.5x-2x joint armature (nominal 0.01). Half the wheel's effective inertia (0.0197).
    armature:
      target: sys
      field: dof_armature
      select: actuated
      mode: scale
      range: [0.5, 2.0]
      dist: log_uniform
    # Wheel hub coulomb friction, absolute N*m (nominal 0.01). dofs 9 and 13 are
    # wheel_L_Joint / wheel_R_Joint (dof_* fields cannot be selected by joint name).
    wheel_frictionloss:
      target: sys
      field: dof_frictionloss
      select: [9, 13]
      mode: abs
      range: [0.0, 0.5]
    # +/-2% rolling radius (nominal 0.127 m, i.e. +/-2.5 mm): tyre wear/compression. Maps
    # the same wheel speed to a different ground speed. A larger wheel starts the trial up
    # to 2.5 mm into the floor, since the home keyframe is solved for the nominal radius.
    wheel_radius:
      target: sys
      field: geom_size
      select: [wheel_L_collision, wheel_R_collision]
      column: 0
      mode: scale
      range: [0.98, 1.02]
    # +/-2cm base center-of-mass offset per axis. The inverted-pendulum balance point sits
    # right under it, so the x offset is the one that matters.
    com_offset:
      target: sys
      field: body_ipos
      select: [base_Link]
      mode: add
      range: [-0.02, 0.02]
      per_element: true
    # controller-gain mismatch: +/-30% of the (8-element) kp/kd gain vectors, shared
    # across joints. kd includes the wheel velocity gain, so this also mis-scales the wheels.
    kp:
      target: config
      field: kp
      mode: scale
      range: [0.70, 1.30]
    kd:
      target: config
      field: kd
      mode: scale
      range: [0.70, 1.30]
